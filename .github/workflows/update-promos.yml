name: Mise à jour nocturne des promos

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install requests beautifulsoup4

      - name: Mise à jour rapide des promos (scrapers + API Intermarché)
        run: python scripts/update_promos_fast.py

      - name: Enrichir les Nutri-Scores
        run: python scripts/enrich_nutriscore.py 2>&1 | tail -n 8 || true

      - name: Générer les recettes de la semaine
        run: python scripts/update_recipes.py

      - name: Sauvegarder la version committée précédente
        run: |
          git show HEAD:data/promos.json > /tmp/promos_prev.json 2>/dev/null || echo '{}' > /tmp/promos_prev.json
          echo "Version précédente sauvegardée"

      - name: Valider le schéma + anti-régression de promos.json
        # Refuse de committer si les volumes s'effondrent vs la version committée
        # (ex: scrape partiel réduisant 1109 offres à 55).
        run: python tests/validate_promos.py --previous /tmp/promos_prev.json

      # Notifications push : demande au worker de comparer les favoris au
      # nouveau promos.json et d'envoyer une alerte quand un seuil est atteint.
      # Ne fait rien si la Variable GitHub WORKER_URL n'est pas renseignée.
      - name: Notifications de favoris (seuils de remise)
        if: ${{ vars.WORKER_URL != '' }}
        run: |
          curl -sS -X POST "${{ vars.WORKER_URL }}/check" \
            -H "Content-Type: application/json" \
            --data-binary @data/promos.json || echo "⚠ worker indisponible, les push seront envoyés à la prochaine execution"

      - name: Commiter data/ si modifié
        run: |
          git config user.name "promo-bot"
          git config user.email "promo-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Mise à jour nocturne des promos ($(date -u +%Y-%m-%d))"
          git push
