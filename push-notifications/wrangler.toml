// Configuration du Worker PromoApp Push (Cloudflare Workers + KV).
//
// ÉTAPES DE DÉPLOIEMENT (une fois) :
//   1.  cd push-notifications && npm install
//   2.  npx wrangler kv namespace create PUSH_KV
//       -> copier l'`id` affiché dans binding ci-dessous.
//   3.  npx wrangler login
//   4.  npx wrangler secret put VAPID_PRIVATE_KEY
//       -> coller le contenu du fichier git-ignoré .vapid-private.key
//   5.  npx wrangler deploy
//   6.  Renseigner WORKER_URL (Variable GitHub) + PUSH_SERVER dans index.html.
//
// Alternative sans ligne de commande : déclencher le workflow GitHub
// "deploy-worker" (il demande 3 secrets + 1 variable, voir .github/workflows/).

name = "promoapp-push"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

# NB : if binding ci-dessous, remplacer RENSEIGNER_PAR_ID par l'id créé avec
#      `npx wrangler kv namespace create PUSH_KV`
[[kv_namespaces]]
binding = "PUSH_KV"
id = "RENSEIGNER_PAR_ID"

# Clé publique VAPID (publique donc sans problème dans le dépôt).
# La clé PRIVÉE doit passer par `npx wrangler secret put VAPID_PRIVATE_KEY`.
[vars]
VAPID_PUBLIC_KEY = "BIWMsehP7WyWwqC-1hMFuL75KxRQuOQLGEo39txiMV3RaxUxk4GbET1nhesf1VghGtqF2WMdfYX-nMwXfoqGJTE"
PUSH_SUBJECT = "mailto:promoapp@example.com"

[observability]
enabled = false