# Configuration du Worker PromoApp Push (Cloudflare Workers + KV).
#
# Déploiement : cd push-notifications && npx wrangler deploy
#   (la namespace KV est déjà créée ; la clé privée VAPID est passée en secret).
# L'URL du worker est ensuite renseignée dans :
#   - index.html    -> constante PUSH_SERVER
#   - Variables GitHub -> WORKER_URL (utilisée par le workflow nocturne /check)

name = "promoapp-push"
main = "src/index.js"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "PUSH_KV"
id = "77ee0f2ccf0d4a6facac9eeaa2a406de"

# Clé publique VAPID (publique donc sans problème dans le dépôt).
# La clé PRIVÉE est un secret Cloudflare : `npx wrangler secret put VAPID_PRIVATE_KEY`.
[vars]
VAPID_PUBLIC_KEY = "BIWMsehP7WyWwqC-1hMFuL75KxRQuOQLGEo39txiMV3RaxUxk4GbET1nhesf1VghGtqF2WMdfYX-nMwXfoqGJTE"
PUSH_SUBJECT = "mailto:promoapp@example.com"

[observability]
enabled = false